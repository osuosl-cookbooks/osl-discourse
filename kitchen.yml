---
driver:
  name: vagrant

verifier:
  name: inspec

transport:
  name: rsync

provisioner:
  name: cinc_infra
  product_version: 18
  enforce_idempotency: true
  multiple_converge: 2
  deprecations_as_errors: true

platforms:
  - name: almalinux-9
  - name: almalinux-10

suites:
  - name: default
    run_list:
      - recipe[discourse_test]
  - name: listen-port
    run_list:
      - recipe[discourse_test::listen_port]
    # Reuse the default suite's inspec profile; only the port under test differs.
    verifier:
      inspec_tests:
        - test/integration/default
      inputs:
        listen_port: 8080
